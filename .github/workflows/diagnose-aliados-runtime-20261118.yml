name: Diagnostic Aliados build vs Cloudflare
on:
  push:
    branches: ['debug/aliados-runtime-publicacion-20261118']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check public and preview hosting for both nicks and old driver
        shell: bash
        run: |
          for host in www.vrixora.com 99ed9455.vrixora-digital-solutions.pages.dev bd8e21f3.vrixora-digital-solutions.pages.dev fe23ba64.vrixora-digital-solutions.pages.dev; do
            for nick in conuco karamba gerson; do
              result=$(curl -sSL --max-time 17 --retry 1 -w '%{http_code}' -D /tmp/hdr -o /tmp/body "https://$host/tuk/$nick" || true)
              echo "RESULT host=$host nick=$nick http=$result"
              grep -i '^x-tuktuk-link-resolver:' /tmp/hdr | head -1 || true
              grep -oE '<title>[^<]*</title>' /tmp/body | head -1 || true
              if grep -q 'te invita a viajar' /tmp/body; then echo "ALLY_BRANDING=yes"; else echo "ALLY_BRANDING=no"; fi
            done
          done
          echo "LOOKUP"
          curl -sSL --max-time 17 -w '\nstatus=%{http_code}\n' 'https://vvxvnywzgtqhlaqpxyqh.supabase.co/functions/v1/marketplace-ally-shortlink?slug=conuco' | head -c 600
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Build real production bundle and locate link implementation
        run: |
          bun install --frozen-lockfile
          bun run build
          echo "Build files"
          find dist .output -maxdepth 3 -type f 2>/dev/null | head -50 || true
          for directory in dist .output; do
            if [ -d "$directory" ]; then
              grep -R -l -m1 'allyShortLinkResponse\|aliado-v1\|marketplace-ally-shortlink' "$directory" 2>/dev/null | head -12 || true
            fi
          done
      - name: Check deployment credentials presence without printing values
        env:
          HAS_CF_API: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CF_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CF_ID: ${{ secrets.CF_ACCOUNT_ID != '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN_PRESENT=$HAS_CF_API"
          echo "CLOUDFLARE_ACCOUNT_ID_PRESENT=$HAS_CF_ACCOUNT"
          echo "CF_API_TOKEN_PRESENT=$HAS_CF_TOKEN"
          echo "CF_ACCOUNT_ID_PRESENT=$HAS_CF_ID"
